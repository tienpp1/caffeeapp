name: flutter_secure_storage_windows
description: Windows Credential Manager adapter for the Cà Phê Mây app.
version: 4.2.2
publish_to: none

environment:
  sdk: ^3.13.1
  flutter: '>=3.35.0'

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_secure_storage_platform_interface: ^2.1.1
  win32: ^6.4.0

flutter:
  plugin:
    implements: flutter_secure_storage
    platforms:
      windows:
        dartPluginClass: FlutterSecureStorageWindows
